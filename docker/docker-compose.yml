# Test/CI environment for redmine-context.
# Brings up Redmine (REST API enabled) backed by Postgres, with named volumes
# and healthchecks. The same file is reused by the CI pipeline (no fork).
#
#   docker compose -f docker/docker-compose.yml up -d
#   docker/wait-for-healthy.sh
#   docker compose -f docker/docker-compose.yml down -v   # clean teardown
#
# Parametrize via environment (see .env.example):
#   REDMINE_PORT (default 3080), POSTGRES_USER/PASSWORD/DB, REDMINE_SECRET_KEY_BASE
name: redmine-context-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-redmine}
      POSTGRES_USER: ${POSTGRES_USER:-redmine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redmine}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redmine} -d ${POSTGRES_DB:-redmine}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redmine:
    image: redmine:6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REDMINE_DB_POSTGRES: postgres
      REDMINE_DB_DATABASE: ${POSTGRES_DB:-redmine}
      REDMINE_DB_USERNAME: ${POSTGRES_USER:-redmine}
      REDMINE_DB_PASSWORD: ${POSTGRES_PASSWORD:-redmine}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:-please-change-me-in-real-envs}
    ports:
      - "${REDMINE_PORT:-3080}:3000"
    volumes:
      - redmine_files:/usr/src/redmine/files
    healthcheck:
      # The official redmine image ships wget (not curl); a 200 on / proves the
      # web app finished migrating the DB and is serving.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s

  # One-shot: enables the REST API right after the default data is loaded, with
  # no manual step. The official image exposes no env for this setting, so we
  # flip it in the DB (idempotent). Updating updated_on invalidates Redmine's
  # settings cache, so the next request already sees rest_api_enabled=1.
  #
  # It also clears the default admin's must_change_passwd flag. The official
  # image seeds admin/admin with must_change_passwd=true, which hard-blocks the
  # REST API via Basic auth with 403 (session/web is unaffected). Since the
  # default password 'admin' is below Redmine's min length (8), it cannot be
  # re-set through the API/web after a real change — so clearing the flag in the
  # DB (idempotent) is the only way to keep admin/admin usable for the API.
  #
  # It also seeds the 'Severidade' custom field (list) for issues. There is no
  # POST /custom_fields.json in the REST API, so — for this test/CI environment
  # only — we create it via idempotent SQL. It depends on load-default-data
  # (which runs first) because an IssueCustomField is only editable on issues
  # whose trackers are linked in custom_fields_trackers; those trackers are
  # created by load-default-data. The seed script then just assigns values.
  enable-rest-api:
    image: postgres:16-alpine
    depends_on:
      load-default-data:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-redmine}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U "${POSTGRES_USER:-redmine}" -d "${POSTGRES_DB:-redmine}" \
          -v ON_ERROR_STOP=1 -c "
            INSERT INTO settings (name, value, updated_on)
            SELECT 'rest_api_enabled', '1', NOW()
            WHERE NOT EXISTS (SELECT 1 FROM settings WHERE name = 'rest_api_enabled');
            UPDATE settings SET value = '1', updated_on = NOW()
            WHERE name = 'rest_api_enabled';
            UPDATE users SET must_change_passwd = false
            WHERE login = 'admin' AND must_change_passwd = true;
            -- Custom field 'Severidade' (list) para issues. Idempotente.
            INSERT INTO custom_fields
              (type, name, field_format, possible_values, regexp, min_length,
               max_length, is_required, is_for_all, is_filter, position,
               searchable, default_value, editable, visible, multiple, format_store)
            SELECT 'IssueCustomField', 'Severidade', 'list',
              E'---\n- Baixa\n- Média\n- Alta\n', '', 0, 0,
              false, true, true, 1, true, '', true, true, false, E'--- {}\n'
            WHERE NOT EXISTS (
              SELECT 1 FROM custom_fields
              WHERE type = 'IssueCustomField' AND name = 'Severidade');
            -- Associa o custom field a todos os trackers (obrigatório para ser
            -- editável nas issues). Idempotente via NOT EXISTS.
            INSERT INTO custom_fields_trackers (custom_field_id, tracker_id)
            SELECT cf.id, t.id
            FROM custom_fields cf CROSS JOIN trackers t
            WHERE cf.type = 'IssueCustomField' AND cf.name = 'Severidade'
              AND NOT EXISTS (
                SELECT 1 FROM custom_fields_trackers x
                WHERE x.custom_field_id = cf.id AND x.tracker_id = t.id);
          "
    restart: "no"

  # One-shot: carrega os dados default do Redmine (trackers, statuses, priorities,
  # roles) numa instalação fresh — sem eles, POST /issues.json falha com 422 e não
  # há REST API para criá-los. Idempotente: o rake avisa quando já carregado.
  # Roda antes de enable-rest-api para que os trackers existam ao criar o custom
  # field (a REST em si não é pré-requisito do rake).
  load-default-data:
    image: redmine:6
    depends_on:
      redmine:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      REDMINE_LANG: en
      SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:-please-change-me-in-real-envs}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /usr/src/redmine
        cat > config/database.yml <<EOF
        production:
          adapter: postgresql
          host: postgres
          database: ${POSTGRES_DB:-redmine}
          username: ${POSTGRES_USER:-redmine}
          password: ${POSTGRES_PASSWORD:-redmine}
        EOF
        bundle exec rake redmine:load_default_data 2>&1 | tee /tmp/out
        # Idempotente: sucesso ("Default configuration data loaded") ou
        # re-execução ("Some configuration data is already loaded") saem 0.
        grep -qiE 'loaded' /tmp/out
    restart: "no"

volumes:
  pgdata:
  redmine_files:
